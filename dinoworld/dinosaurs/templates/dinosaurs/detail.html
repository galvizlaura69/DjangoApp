<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>{{ dinosaur.name }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {

            background-image:
                linear-gradient(rgba(0, 0, 0, 0.7),
                    rgba(0, 0, 0, 0.8)),
                url("https://wallpapercave.com/wp/wp2464222.jpg");

            background-size: cover;

            background-attachment: fixed;

            min-height: 100vh;

            color: white;
        }

        body::before,
        body::after {

            content: "";

            position: fixed;

            top: 0;

            width: 140px;

            height: 100vh;

            z-index: 0;

            background-image:
                url("https://i.pinimg.com/originals/fb/c8/c5/fbc8c52454ed82d15961252c31f9aad1.jpg");

            background-repeat: repeat-y;

            background-size: cover;

            opacity: 0.95;
        }

        body::before {

            left: 0;
        }

        body::after {

            right: 0;
        }

        .carnivoro {

            color: #ff4d4d;
        }

        .carnivoro-border {

            border-color: #ff4d4d !important;
        }

        .carnivoro-shadow {

            box-shadow: 0px 0px 20px #ff4d4d !important;
        }

        .carnivoro-bg {

            background: linear-gradient(to bottom,
                    #7a1f1f,
                    #2b0000);
        }

        .carnivoro-button {

            background-color: #ff4d4d;

            color: black;
        }

        .container {

            position: relative;

            z-index: 1;

            padding-left: 170px;

            padding-right: 170px;
        }

        .pokemon-card {

            max-width: 1100px;

            margin: auto;

            border-radius: 30px;

            overflow: hidden;

            display: flex;

            align-items: center;

            gap: 35px;

            padding: 30px;

            border: 2px solid white;
        }

        .image-container {

            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .pokemon-image {

            width: 100%;

            max-width: 400px;

            height: 550px;

            object-fit: cover;

            border-radius: 25px;

            border: 3px solid white;
        }

        .info-container {

            flex: 1.2;
        }

        .type-badge {

            padding: 10px 25px;

            border-radius: 20px;

            display: inline-block;

            font-weight: bold;

            margin-bottom: 25px;
        }

        .votes {

            font-size: 1.5rem;

            margin-top: 25px;

            font-weight: bold;
        }

        .vote-button {

            margin-top: 30px;

            padding: 15px;

            font-size: 1.2rem;

            border-radius: 15px;

            border: none;

            font-weight: bold;
        }

        .vote-button:hover {

            background-color: white !important;

            color: black !important;
        }

        input,
        textarea {

            background-color: rgba(255, 255, 255, 0.1) !important;

            color: white !important;

            border: 1px solid white !important;
        }

        input:disabled,
        textarea:disabled {

            opacity: 1;

            cursor: default;
        }

        @media (max-width: 900px) {

            .pokemon-card {

                flex-direction: column;
            }

            .pokemon-image {

                height: 380px;
            }

            body::before,
            body::after {

                display: none;
            }

            .container {

                padding-left: 20px;

                padding-right: 20px;
            }
        }

    </style>

</head>

<body>

    <!-- MENSAJES -->

    {% if messages %}

    <div class="container mt-3">

        {% for message in messages %}

        <div class="alert alert-success alert-dismissible fade show">

            {{ message }}

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert">
            </button>

        </div>

        {% endfor %}

    </div>

    {% endif %}

    <div class="container py-5">

        <!-- BOTÓN VOLVER -->

        <div class="mb-4">

            <a
                href="{% url 'dinosaurs:category' dinosaur.category.id %}"
                class="btn btn-outline-light"
            >
                ←
            </a>

        </div>

        <!-- CARD -->

        <div class="pokemon-card carnivoro-bg carnivoro-border carnivoro-shadow">

            <!-- IMAGEN -->

            <div class="image-container">

                <img
                    src="{{ dinosaur.image }}"
                    class="pokemon-image carnivoro-border carnivoro-shadow"
                >

            </div>

            <!-- INFO -->

            <div class="info-container">

                <!-- FORM UPDATE -->

                <form
                    id="updateForm"
                    action="{% url 'dinosaurs:update' dinosaur.id %}"
                    method="post"
                >

                    {% csrf_token %}

                    <!-- NOMBRE -->

                    <input
                        type="text"
                        name="name"
                        value="{{ dinosaur.name }}"
                        class="form-control mb-3"
                        id="nameInput"
                        disabled
                    >

                    <!-- CATEGORÍA -->

                    <span class="type-badge carnivoro-button">
                        {{ dinosaur.category.name }}
                    </span>

                    <hr>

                    <!-- DESCRIPCIÓN -->

                    <textarea
                        name="description"
                        class="form-control mb-3"
                        rows="5"
                        id="descriptionInput"
                        disabled
                    >{{ dinosaur.description }}</textarea>

                    <!-- IMAGEN -->

                    <input
                        type="text"
                        name="image"
                        value="{{ dinosaur.image }}"
                        class="form-control mb-3"
                        id="imageInput"
                        disabled
                    >

                    <!-- BOTONES EDICIÓN -->

                    <div
                        id="editButtons"
                        class="gap-3 mt-3"
                        style="display:none;"
                    >

                        <!-- GUARDAR -->

                        <button
                            type="submit"
                            class="btn btn-success w-50"
                        >
                            Guardar Cambios
                        </button>

                        <!-- CANCELAR -->

                        <button
                            type="button"
                            class="btn btn-secondary w-50"
                            onclick="cancelarEdicion()"
                        >
                            Cancelar
                        </button>

                    </div>

                </form>

                <!-- VOTOS -->

                <div class="votes">

                    Total Votos:
                    {{ dinosaur.votes }}

                </div>

                <!-- FAVORITO -->

                <form
                    action="{% url 'dinosaurs:vote' dinosaur.id %}"
                    method="post"
                >

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn vote-button carnivoro-button w-100"
                    >
                        Favorito
                    </button>

                </form>

                <!-- CRUD -->

                <div class="d-flex gap-3 mt-4">

                    <!-- ACTUALIZAR -->

                    <button
                        type="button"
                        id="updateButton"
                        class="btn btn-warning w-50"
                        onclick="activarEdicion()"
                    >
                        ✏️ Actualizar
                    </button>

                    <!-- ELIMINAR -->

                    <form
                        action="{% url 'dinosaurs:delete' dinosaur.id %}"
                        method="post"
                        class="w-50"
                        onsubmit="return confirmarEliminar()"
                    >

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger w-100"
                        >
                            🗑️ Eliminar
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- JS -->

    <script>

        // GUARDAR VALORES ORIGINALES

        const originalName =
            document.getElementById(
                "nameInput"
            ).value;

        const originalDescription =
            document.getElementById(
                "descriptionInput"
            ).value;

        const originalImage =
            document.getElementById(
                "imageInput"
            ).value;


        function activarEdicion() {

            // HABILITAR INPUTS

            document.getElementById(
                "nameInput"
            ).disabled = false;

            document.getElementById(
                "descriptionInput"
            ).disabled = false;

            document.getElementById(
                "imageInput"
            ).disabled = false;

            // MOSTRAR BOTONES

            const editButtons =
                document.getElementById(
                    "editButtons"
                );

            editButtons.style.display =
                "flex";

            editButtons.classList.add(
                "d-flex"
            );

            // OCULTAR ACTUALIZAR

            document.getElementById(
                "updateButton"
            ).style.display = "none";
        }


        function cancelarEdicion() {

            // RESTAURAR VALORES

            document.getElementById(
                "nameInput"
            ).value = originalName;

            document.getElementById(
                "descriptionInput"
            ).value = originalDescription;

            document.getElementById(
                "imageInput"
            ).value = originalImage;

            // DESHABILITAR INPUTS

            document.getElementById(
                "nameInput"
            ).disabled = true;

            document.getElementById(
                "descriptionInput"
            ).disabled = true;

            document.getElementById(
                "imageInput"
            ).disabled = true;

            // OCULTAR BOTONES

            const editButtons =
                document.getElementById(
                    "editButtons"
                );

            editButtons.style.display =
                "none";

            editButtons.classList.remove(
                "d-flex"
            );

            // MOSTRAR BOTÓN ACTUALIZAR

            document.getElementById(
                "updateButton"
            ).style.display = "block";
        }


        function confirmarEliminar() {

            return confirm(
                "¿Seguro que deseas eliminar este dinosaurio?"
            );
        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
